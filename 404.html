<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shuxun Tian | Beijing Normal University</title>
  <script>
    // The homepage router restores this path and query after a direct visit.
    if (location.protocol !== 'file:') {
      const homeUrl = new URL('/', location.href);
      homeUrl.searchParams.set('route', location.pathname + location.search);
      location.replace(homeUrl.href);
    }
  </script>
</head>

</body>
