  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shuxun Tian | Beijing Normal University</title>
  <script>
    // GitHub Pages requires 404.html; index.html restores the path from "route".
    if (location.protocol !== 'file:') {
      const home = new URL('/', location.href);
      home.searchParams.set('route', location.pathname + location.search);
      location.replace(home.href);
    }
  </script>
</head>

</body>
